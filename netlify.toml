# Publish ONLY the page, never the repo. With publish = "." every file here went to the
# web — the test suite, DOCUMENTATION.md, README.md, package.json were all fetchable on a
# site whose whole premise is that it is by invitation. It also put test fixtures in the
# deployable output, which is how a hardcoded passcode in a test once reached the secret
# scanner. The page is self-contained (one index.html, data: favicon, functions called over
# /.netlify/functions), so staging it alone costs nothing and removes the whole surface.
[build]
  command = "rm -rf _site && mkdir -p _site && cp index.html _site/"
  functions = "netlify/functions"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Always serve fresh HTML. The suite is a single index.html; without this,
# Netlify/browsers can cache a stale copy, which shows up as a blank/old page
# on return visits. max-age=0 + must-revalidate keeps the page current while
# still allowing efficient 304s when nothing changed.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Nothing here is meant to be framed. The Finesse handoff uses an explicit consent WINDOW,
# not an embed, so framing buys nothing and only opens a clickjacking surface on a product
# that holds someone's business plan. Deny it outright.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
